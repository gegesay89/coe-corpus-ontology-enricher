name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv>=0.8,<1"
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Test
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest
      - name: Synthetic smoke test
        run: |
          uv run coe hardware probe
          uv run coe demo create .ci-demo
          uv run coe run --snapshot .ci-demo/snapshot --reference .ci-demo/reference --config .ci-demo/coe_config.json --curation-snapshot genesis-v0 --output .ci-out
