[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coe-corpus-ontology-enricher"
version = "0.3.0a1"
description = "Deterministic corpus terminology analysis with controlled licensed-reference and protected-local profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Gehad Sayed Ahmed" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
coe = "coe.cli:main"

[tool.setuptools.packages.find]
include = ["coe*"]

[tool.setuptools.data-files]
"share/coe" = ["COE_DESIGN_AND_PLAN.md"]
"share/coe/specs" = ["specs/licensed_terminologies.json"]
"share/coe/migrations" = ["migrations/README.md"]
"share/coe/schemas/snapshot/1.0.0" = [
  "schemas/snapshot/1.0.0/snapshot_manifest.schema.json",
  "schemas/snapshot/1.0.0/document.schema.json",
  "schemas/snapshot/1.0.0/deidentification_attestation.schema.json",
]
"share/coe/schemas/reference/1.0.0" = [
  "schemas/reference/1.0.0/terminology_release_manifest.schema.json",
  "schemas/reference/1.0.0/coding.schema.json",
  "schemas/reference/1.0.0/designation.schema.json",
]
"share/coe/schemas/reference/1.1.0" = [
  "schemas/reference/1.1.0/reference_set_manifest.schema.json",
]
"share/coe/schemas/config/1.0.0" = ["schemas/config/1.0.0/analysis_config.schema.json"]
"share/coe/schemas/config/1.1.0" = ["schemas/config/1.1.0/analysis_config.schema.json"]
"share/coe/schemas/curation/1.0.0" = [
  "schemas/curation/1.0.0/curation_decision.schema.json",
  "schemas/curation/1.0.0/curation_snapshot.schema.json",
]
"share/coe/schemas/governance/1.0.0" = [
  "schemas/governance/1.0.0/terminology_entitlement_assertion.schema.json",
]
"share/coe/schemas/protected/1.0.0" = [
  "schemas/protected/1.0.0/data_use_attestation.schema.json",
  "schemas/protected/1.0.0/coding_count.schema.json",
  "schemas/protected/1.0.0/ambiguity_count.schema.json",
  "schemas/protected/1.0.0/run_report.schema.json",
]
"share/coe/schemas/run/1.0.0" = [
  "schemas/run/1.0.0/candidate_set.schema.json",
  "schemas/run/1.0.0/phrase_aggregate.schema.json",
  "schemas/run/1.0.0/run_manifest.schema.json",
  "schemas/run/1.0.0/run_report.schema.json",
  "schemas/run/1.0.0/artifact_manifest.schema.json",
]
"share/coe/schemas/run/1.1.0" = [
  "schemas/run/1.1.0/candidate_set.schema.json",
]
"share/coe/schemas/protected/1.1.0" = [
  "schemas/protected/1.1.0/data_use_attestation.schema.json",
  "schemas/protected/1.1.0/coding_count.schema.json",
  "schemas/protected/1.1.0/ambiguity_count.schema.json",
  "schemas/protected/1.1.0/lexical_form.schema.json",
  "schemas/protected/1.1.0/candidate_term.schema.json",
  "schemas/protected/1.1.0/association.schema.json",
  "schemas/protected/1.1.0/run_report.schema.json",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=coe --cov-report=term --cov-fail-under=75"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["coe"]

[tool.coverage.report]
show_missing = true
skip_covered = true
